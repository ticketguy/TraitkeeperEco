{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard - TraitKeeper Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-running { background-color: #10b981; animation: pulse 2s infinite; }
        .status-stopped { background-color: #ef4444; }
        .status-paused { background-color: #f59e0b; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .priority-high { border-left: 4px solid #ef4444; }
        .priority-medium { border-left: 4px solid #f59e0b; }
        .priority-low { border-left: 4px solid #10b981; }
        .log-entry {
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <div class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Task Manager Dashboard</h1>
                    <p class="mt-1 text-sm text-gray-500">Real-time monitoring of background tasks</p>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="connection-status" class="px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800">
                        <span class="status-dot status-stopped"></span>
                        Disconnected
                    </span>
                    <a href="{% url 'admin:index' %}" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                        Back to Admin
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- System Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Manager Status</p>
                        <p id="manager-status" class="mt-2 text-3xl font-bold text-gray-900">--</p>
                    </div>
                    <div class="p-3 bg-blue-100 rounded-full">
                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Active Tasks</p>
                        <p id="active-tasks" class="mt-2 text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="p-3 bg-green-100 rounded-full">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Queued Tasks</p>
                        <p id="queued-tasks" class="mt-2 text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="p-3 bg-yellow-100 rounded-full">
                        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500">Completed</p>
                        <p id="completed-tasks" class="mt-2 text-3xl font-bold text-gray-900">0</p>
                    </div>
                    <div class="p-3 bg-purple-100 rounded-full">
                        <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Active Tasks Table -->
        <div class="bg-white rounded-lg shadow mb-6">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-semibold text-gray-900">Active Tasks</h2>
            </div>
            <div class="p-6">
                <div id="active-tasks-list" class="space-y-3">
                    <p class="text-gray-500 text-center py-8">No active tasks</p>
                </div>
            </div>
        </div>

        <!-- Task History -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-900">Recent Task History</h2>
                <button onclick="loadHistory()" class="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 rounded-md transition">
                    Refresh History
                </button>
            </div>
            <div class="p-6">
                <div id="task-history-list" class="space-y-2 max-h-96 overflow-y-auto">
                    <p class="text-gray-500 text-center py-8">Loading task history...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        const reconnectDelay = 3000;

        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/task-manager/`;

            // console.log('Connecting to WebSocket:', wsUrl);

            socket = new WebSocket(wsUrl);

            socket.onopen = function(e) {
                // console.log('WebSocket connection established');
                reconnectAttempts = 0;
                updateConnectionStatus(true);

                // Request initial status
                socket.send(JSON.stringify({
                    type: 'get_status'
                }));
            };

            socket.onmessage = function(event) {
                // console.log('Message received:', event.data);
                const data = JSON.parse(event.data);

                if (data.type === 'status_update') {
                    updateDashboard(data.data);
                } else if (data.type === 'history_update') {
                    updateHistory(data.data);
                } else if (data.type === 'error') {
                    console.error('WebSocket error:', data.message);
                }
            };

            socket.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus(false);
            };

            socket.onclose = function(event) {
                // console.log('WebSocket connection closed');
                updateConnectionStatus(false);

                // Attempt to reconnect
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    // console.log(`Attempting to reconnect (${reconnectAttempts}/${maxReconnectAttempts})...`);
                    setTimeout(connectWebSocket, reconnectDelay);
                }
            };
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connection-status');
            if (connected) {
                statusEl.innerHTML = '<span class="status-dot status-running"></span>Connected';
                statusEl.className = 'px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800';
            } else {
                statusEl.innerHTML = '<span class="status-dot status-stopped"></span>Disconnected';
                statusEl.className = 'px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800';
            }
        }

        function updateDashboard(status) {
            // Update status cards
            document.getElementById('manager-status').textContent = status.is_running ? 'Running' : 'Stopped';
            document.getElementById('active-tasks').textContent = status.active_tasks || 0;
            document.getElementById('queued-tasks').textContent = status.queued_tasks || 0;
            document.getElementById('completed-tasks').textContent = status.completed_tasks || 0;

            // Update active tasks list
            const activeTasksList = document.getElementById('active-tasks-list');
            if (status.current_tasks && status.current_tasks.length > 0) {
                activeTasksList.innerHTML = status.current_tasks.map(task => `
                    <div class="task-card bg-gray-50 rounded-lg p-4 priority-${task.priority?.toLowerCase() || 'medium'}">
                        <div class="flex items-center justify-between">
                            <div class="flex-1">
                                <h3 class="font-semibold text-gray-900">${task.name || 'Unnamed Task'}</h3>
                                <p class="text-sm text-gray-500 mt-1">${task.id || ''}</p>
                            </div>
                            <div class="flex items-center space-x-3">
                                <span class="px-2 py-1 text-xs font-medium rounded-full ${getPriorityClass(task.priority)}">
                                    ${task.priority || 'MEDIUM'}
                                </span>
                                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
                            </div>
                        </div>
                        ${task.progress ? `
                            <div class="mt-3">
                                <div class="flex items-center justify-between text-sm mb-1">
                                    <span class="text-gray-600">Progress</span>
                                    <span class="font-medium text-gray-900">${task.progress}%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: ${task.progress}%"></div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } else {
                activeTasksList.innerHTML = '<p class="text-gray-500 text-center py-8">No active tasks</p>';
            }
        }

        function getPriorityClass(priority) {
            switch(priority?.toUpperCase()) {
                case 'HIGH':
                    return 'bg-red-100 text-red-800';
                case 'MEDIUM':
                    return 'bg-yellow-100 text-yellow-800';
                case 'LOW':
                    return 'bg-green-100 text-green-800';
                default:
                    return 'bg-gray-100 text-gray-800';
            }
        }

        function updateHistory(historyData) {
            const historyList = document.getElementById('task-history-list');
            if (historyData && historyData.length > 0) {
                historyList.innerHTML = historyData.map(entry => {
                    const statusClass = entry.status === 'completed' ? 'bg-green-50 text-green-700' :
                                       entry.status === 'failed' ? 'bg-red-50 text-red-700' :
                                       'bg-gray-50 text-gray-700';
                    return `
                        <div class="log-entry p-3 ${statusClass} rounded border-l-4 ${entry.status === 'completed' ? 'border-green-500' : entry.status === 'failed' ? 'border-red-500' : 'border-gray-500'}">
                            <div class="flex items-center justify-between">
                                <span class="font-medium">${entry.task_name || 'Task'}</span>
                                <span class="text-xs">${formatTimestamp(entry.timestamp)}</span>
                            </div>
                            ${entry.error ? `<p class="text-xs mt-1 text-red-600">Error: ${entry.error}</p>` : ''}
                            ${entry.duration ? `<p class="text-xs mt-1">Duration: ${entry.duration}s</p>` : ''}
                        </div>
                    `;
                }).join('');
            } else {
                historyList.innerHTML = '<p class="text-gray-500 text-center py-8">No task history available</p>';
            }
        }

        function loadHistory() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'get_history'
                }));
            }
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }

        // Auto-refresh status every 5 seconds
        setInterval(() => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'get_status'
                }));
            }
        }, 5000);

        // Load history on page load
        window.addEventListener('load', () => {
            connectWebSocket();
            setTimeout(loadHistory, 1000);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (socket) {
                socket.close();
            }
        });
    </script>
</body>
</html>
