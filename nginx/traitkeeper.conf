# ==================================================
# TraitKeeper Nginx Configuration
# ==================================================
# Production-ready Nginx configuration for TraitKeeper
#
# Installation:
#   1. Copy this file: sudo cp nginx/traitkeeper.conf /etc/nginx/sites-available/traitkeeper
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/traitkeeper /etc/nginx/sites-enabled/
#   3. Test config: sudo nginx -t
#   4. Reload Nginx: sudo systemctl reload nginx
#   5. Get SSL cert: sudo certbot --nginx -d yourdomain.com
# ==================================================

# Upstream configuration for load balancing
upstream traitkeeper_web {
    # Use IP hash for sticky sessions (important for WebSockets)
    ip_hash;

    # Main web server
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;

    # Additional servers for load balancing (uncomment if you have multiple instances)
    # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;

    # Keep-alive connections for better performance
    keepalive 32;
}

# Rate limiting zones
# Protects against DDoS and brute force attacks
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ==================================================
# HTTP Server - Redirect to HTTPS
# ==================================================
server {
    listen 80;
    listen [::]:80;
    server_name traitkeeper.com www.traitkeeper.com;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ==================================================
# HTTPS Server - Main Application
# ==================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traitkeeper.com www.traitkeeper.com;

    # Root directory (for static files served directly)
    root /home/user/TraitkeeperEco;

    # ========================================
    # SSL Configuration
    # ========================================
    # Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/traitkeeper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traitkeeper.com/privkey.pem;

    # SSL session cache for performance
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern SSL configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP stapling for faster SSL handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/traitkeeper.com/chain.pem;

    # DNS resolvers for OCSP
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ========================================
    # Security Headers
    # ========================================
    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy (limit browser features)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (CSP)
    # Adjust this based on your actual needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://api.mainnet-beta.solana.com wss://api.mainnet-beta.solana.com; frame-ancestors 'none';" always;

    # ========================================
    # Logging
    # ========================================
    access_log /var/log/nginx/traitkeeper_access.log combined;
    error_log /var/log/nginx/traitkeeper_error.log warn;

    # ========================================
    # General Settings
    # ========================================
    # Maximum upload size (adjust based on your needs)
    client_max_body_size 50M;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # ========================================
    # Compression
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ========================================
    # Static Files
    # ========================================
    # Static files (CSS, JavaScript, images)
    location /static/ {
        alias /home/user/TraitkeeperEco/staticfiles/;

        # Cache static files aggressively
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Security headers (these override the ones above)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # CORS for static assets (if needed)
        # add_header Access-Control-Allow-Origin "*" always;

        # Optimize file serving
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Disable access logs for static files (optional, for performance)
        access_log off;
    }

    # Media files (user uploads)
    location /media/ {
        alias /home/user/TraitkeeperEco/media/;

        # Shorter cache for media (users might change avatars, etc.)
        expires 7d;
        add_header Cache-Control "public";

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Optimize file serving
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # ========================================
    # Favicon & Robots
    # ========================================
    location = /favicon.ico {
        alias /home/user/TraitkeeperEco/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 90d;
    }

    location = /robots.txt {
        alias /home/user/TraitkeeperEco/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ========================================
    # API Endpoints with Rate Limiting
    # ========================================
    location /api/ {
        # Rate limiting (20 requests per second)
        limit_req zone=api burst=30 nodelay;
        limit_conn addr 10;

        # Proxy to Django
        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for faster response
        proxy_buffering off;

        # Timeouts for API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Authentication endpoints with strict rate limiting
    location ~ ^/(accounts/login|accounts/signup|admin/login)/ {
        # Very strict rate limiting (5 requests per minute)
        limit_req zone=auth burst=5 nodelay;
        limit_conn addr 3;

        # Proxy to Django
        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # WebSocket Support (for Django Channels)
    # ========================================
    location /ws/ {
        # WebSocket specific settings
        proxy_pass http://traitkeeper_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (longer for WebSockets)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering
        proxy_buffering off;
    }

    # ========================================
    # Main Application
    # ========================================
    location / {
        # General rate limiting (10 requests per second)
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        # Proxy to Django
        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection and request upgrades for WebSocket compatibility
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================
    # Security - Block Sensitive Files
    # ========================================
    # Deny access to .env files
    location ~ /\.env {
        deny all;
        return 404;
    }

    # Deny access to git files
    location ~ /\.git {
        deny all;
        return 404;
    }

    # Deny access to Python files
    location ~ \.py$ {
        deny all;
        return 404;
    }

    # Deny access to configuration files
    location ~ \.(yml|yaml|toml|lock)$ {
        deny all;
        return 404;
    }
}

# ==================================================
# WebSocket Connection Upgrade Map
# ==================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ==================================================
# Additional Configuration Notes
# ==================================================
#
# 1. Rate Limiting:
#    - General pages: 10 req/s with burst of 20
#    - API endpoints: 20 req/s with burst of 30
#    - Auth endpoints: 5 req/minute with burst of 5
#
# 2. SSL/TLS:
#    - Using Let's Encrypt certificates
#    - TLS 1.2 and 1.3 only
#    - OCSP stapling enabled
#
# 3. Security Headers:
#    - HSTS with 1 year max-age
#    - X-Frame-Options: DENY
#    - Content-Security-Policy configured
#
# 4. Performance:
#    - Gzip compression enabled
#    - Static files cached for 30 days
#    - Keep-alive connections
#    - Sendfile enabled
#
# 5. Monitoring:
#    - Access logs: /var/log/nginx/traitkeeper_access.log
#    - Error logs: /var/log/nginx/traitkeeper_error.log
#
# ==================================================
