# ==================================================
# TraitKeeper Nginx Configuration
# ==================================================

# Upstream configuration for load balancing
upstream traitkeeper_web {
    ip_hash;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ==================================================
# HTTP Server - Redirect to HTTPS
# ==================================================
server {
    listen 80;
    listen [::]:80;
    server_name traitkeeper.xyz www.traitkeeper.xyz traitkeeper.io www.traitkeeper.io traitkeeper.tk traitkeeper.com www.traitkeeper.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ==================================================
# HTTPS Server - Main Application
# ==================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name traitkeeper.xyz www.traitkeeper.xyz traitkeeper.io www.traitkeeper.io traitkeeper.tk traitkeeper.com www.traitkeeper.com;

    # ========================================
    # SSL Configuration
    # ========================================
    ssl_certificate /etc/letsencrypt/live/traitkeeper.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traitkeeper.xyz/privkey.pem;

    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/traitkeeper.xyz/chain.pem;

    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ========================================
    # Security Headers
    # ========================================
    # Note: HSTS, X-Frame-Options, X-Content-Type-Options are set by Django
    # to avoid duplicate headers and improve security grade

    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP without unsafe-inline/unsafe-eval (requires nonce-based script loading)
    # Adjusted to allow required external resources while maintaining security
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://api.mainnet-beta.solana.com wss://api.mainnet-beta.solana.com; frame-ancestors 'none';" always;

    # ========================================
    # Logging
    # ========================================
    access_log /var/log/nginx/traitkeeper_access.log combined;
    error_log /var/log/nginx/traitkeeper_error.log warn;

    # ========================================
    # General Settings
    # ========================================
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;

    # ========================================
    # Compression
    # ========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ========================================
    # Static Files
    # ========================================
    location /static/ {
        alias /home/user/TraitkeeperEco/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        access_log off;
    }

    location /media/ {
        alias /home/user/TraitkeeperEco/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # ========================================
    # Favicon & Robots
    # ========================================
    location = /favicon.ico {
        alias /home/user/TraitkeeperEco/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 90d;
    }

    location = /robots.txt {
        alias /home/user/TraitkeeperEco/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ========================================
    # API Endpoints with Rate Limiting
    # ========================================
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_conn addr 10;

        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~ ^/(accounts/login|accounts/signup|admin/login)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_conn addr 3;

        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # WebSocket Support
    # ========================================
    location /ws/ {
        proxy_pass http://traitkeeper_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        proxy_buffering off;
    }

    # ========================================
    # Main Application
    # ========================================
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        proxy_pass http://traitkeeper_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ========================================
    # Security - Block Sensitive Files
    # ========================================
    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    location ~ \.py$ {
        deny all;
        return 404;
    }

    location ~ \.(yml|yaml|toml|lock)$ {
        deny all;
        return 404;
    }
}

# ==================================================
# WebSocket Connection Upgrade Map
# ==================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}