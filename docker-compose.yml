

services:
  # ===================================================================
  # SHARED INFRASTRUCTURE
  # ===================================================================
  
  # PostgreSQL Database (Shared by all processes)
  postgres:
    image: postgres:15-alpine
    container_name: traitkeeper-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # SECURITY: Bind to localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traitkeeper-network

  # Redis Cache (Shared by all processes)
  redis:
    image: redis:7-alpine
    container_name: traitkeeper-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # SECURITY: Bind to localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traitkeeper-network

  # ===================================================================
  # WEB SERVER (User-facing)
  # ===================================================================
  
  main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-main
    env_file:
      - .env
    environment:
      RUN_BACKGROUND_TASKS: "false"  # Web server only, no background tasks
      LOG_FILE_PATH: "/app/logs/background_tasks.log"  # Use app directory for logs
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper  # Support both log paths
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🌐 Main App: Waiting for database...' &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        echo '🚀 Main App: Starting gunicorn...' &&
        exec gunicorn traitkeeper.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --worker-class gthread --timeout 180 --max-requests 1000 --max-requests-jitter 50 --access-logfile - --error-logfile - --log-level info
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - traitkeeper-network

  # ===================================================================
  # INDEXING SERVICES
  # ===================================================================
  
  # Live WebSocket Indexer (Real-time transaction processing)
  indexer-live:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-indexer-live
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=traitkeeper.settings
      - RUN_BACKGROUND_TASKS=true
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHANNEL_URL=redis://redis:6379/1
      - LOG_FILE_PATH=/app/logs/indexer_live.log
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...';
        sleep 10;
        python manage.py run_live_indexer
      "
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_live_indexer' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - traitkeeper-network

  # Scheduled/Historical Indexer (Periodic polling for historical data)
  indexer-scheduled:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-indexer-scheduled
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=traitkeeper.settings
      - RUN_BACKGROUND_TASKS=true
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHANNEL_URL=redis://redis:6379/1
      - LOG_FILE_PATH=/app/logs/indexer_scheduled.log
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...';
        sleep 10;
        python manage.py run_scheduled_indexer
      "
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_scheduled_indexer' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - traitkeeper-network

  # Incremental Indexer (Catches missed transactions every 4 hours)
  indexer-incremental:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-indexer-incremental
    env_file:
      - .env
    environment:
      LOG_FILE_PATH: "/app/logs/indexer_incremental.log"
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    command: >
      sh -c "
        echo '🔄 Incremental Indexer: Starting transaction catch-up service...' &&
        python manage.py run_incremental_indexer
      "
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_incremental_indexer' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - traitkeeper-network

  # ===================================================================
  # ANALYTICS SERVICES
  # ===================================================================

  # Vitality Analytics Service (Vitality calculations + future metrics/trends)
  vitality-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitality-analytics
    env_file:
      - .env
    environment:
      RUN_BACKGROUND_TASKS: "true"  # Needed for vitality task manager
      LOG_FILE_PATH: "/app/logs/vitality_analytics.log"
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    command: >
      sh -c "
        echo '📊 Vitality Analytics: Starting vitality analytics services...' &&
        python manage.py run_vitality_analytics_service
      "
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_vitality_analytics_service' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - traitkeeper-network

  # ===================================================================
  # MONITORING SERVICES
  # ===================================================================
  
  # System Health Monitor (Performance metrics, anomaly detection, alerts)
  health:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-health
    env_file:
      - .env
    environment:
      LOG_FILE_PATH: "/app/logs/health.log"
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for health checks
    group_add:
      - "999"  # Add docker group to allow socket access
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      main:
        condition: service_healthy
    command: >
      sh -c "
        echo '🏥 Health: Starting system health monitoring...' &&
        python manage.py run_health_service
      "
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[r]un_health_service' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - traitkeeper-network

  # Config Listener (Watches for provider config changes)
  config-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-config-listener
    env_file:
      - .env
    environment:
      LOG_FILE_PATH: "/app/logs/config_listener.log"
    volumes:
      - ./logs:/app/logs
      - ./logs:/var/log/traitkeeper
    command: >
      sh -c "
        echo '⚙️  Config Listener: Starting...' &&
        python manage.py listen_for_config_updates
      "
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[l]isten_for_config_updates' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    networks:
      - traitkeeper-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  traitkeeper-network:
    driver: bridge