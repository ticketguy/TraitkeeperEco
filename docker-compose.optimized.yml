version: '3.8'

# OPTIMIZED INDEXERS - Run alongside existing indexers for safe testing
# This compose file adds NEW optimized containers without touching existing ones
#
# PREREQUISITES:
# 1. Main docker-compose must be running (for postgres, redis, network)
# 2. Run: docker-compose up -d postgres redis
# 3. Then: docker-compose -f docker-compose.optimized.yml up -d

services:
  # ==================== OPTIMIZED SCHEDULED INDEXER ====================
  indexer-scheduled-optimized:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-indexer-scheduled-optimized
    command: >
      sh -c "
      echo 'Waiting for database...';
      sleep 10;
      python manage.py run_scheduled_indexer_optimized
      "
    environment:
      - DJANGO_SETTINGS_MODULE=traitkeeper.settings
      - RUN_BACKGROUND_TASKS=true
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHANNEL_URL=redis://redis:6379/1
    env_file:
      - .env
    networks:
      - traitkeeper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ==================== OPTIMIZED LIVE INDEXER ====================
  indexer-live-optimized:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traitkeeper-indexer-live-optimized
    command: >
      sh -c "
      echo 'Waiting for database...';
      sleep 10;
      python manage.py run_live_indexer_optimized
      "
    environment:
      - DJANGO_SETTINGS_MODULE=traitkeeper.settings
      - RUN_BACKGROUND_TASKS=true
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CHANNEL_URL=redis://redis:6379/1
    env_file:
      - .env
    networks:
      - traitkeeper-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# Use existing network from main docker-compose
networks:
  traitkeeper-network:
    external: true
