{% extends 'dashboard_base.html'%}
{% load static %}


{% block content %}

<section id="trait-comparison">
    <h2>Trait Comparison Tool</h2>
    <div class="comparison-controls">
        <div class="nft-selector">
            <select id="nft1" class="nft-select">
                <option value="">Select NFT 1</option>
            </select>
            <select id="nft2" class="nft-select">
                <option value="">Select NFT 2</option>
            </select>
            <button id="addNftBtn">+ Add NFT</button>
        </div>
        <div class="comparison-options">
            <button id="compareBtn">Compare</button>
            <select id="comparisonType">
                <option value="sideBySide">Side by Side</option>
                <option value="traitDistribution">Trait Distribution</option>
                <option value="radarChart">Radar Chart</option>
            </select>
        </div>
    </div>
    <div id="comparisonResults">
        <div id="sideBySideComparison" class="comparison-view"></div>
        <div id="traitDistributionChart" class="comparison-view"></div>
        <canvas id="radarChart" class="comparison-view"></canvas>
    </div>
</section>

  {% endblock %}

{% block extra_js %}
<script src="{% static 'js/scripts/dashboard/trait-comparison.js' %}"></script>
{% endblock %}
