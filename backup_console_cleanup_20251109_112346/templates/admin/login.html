<!-- admin/login.html -->

<!DOCTYPE html>
<html lang="en" {% if LANGUAGE_BIDI %}dir="rtl"{% endif %} class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TraitKeeper Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#800080',
                        'primary-dark': '#660066',
                        'brand-grey': '#808080',
                        'brand-shadow': 'rgba(128, 0, 128, 0.1)',
                        background: { light: '#FFFFFF', dark: '#121212' },
                        text: { light: '#0A0A0A', dark: '#E0E0E0' },
                        accent: { light: '#F3F4F6', dark: '#1E1E1E' },
                        border: { light: '#E5E7EB', dark: '#333333' },
                        'text-secondary': { light: '#6B7280', dark: '#808080' },
                        'brand-purple': '#800080',
                        'brand-black': '#0A0A0A',
                        'brand-white': '#FFFFFF',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-in-out',
                        'pulse': 'pulse 2s infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(8px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pulse: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.5' } },
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&family=Roboto:wght@100..900&family=Space+Mono:wght@400..700&family=Courier+Prime:wght@400..700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Particles.js for subtle background effects, deferred -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js" defer></script>

    <!-- Inline Critical CSS -->
    <style>
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(128, 0, 128, 0.15);
        }
        .glow-button {
            background: linear-gradient(45deg, #800080, #660066);
            transition: all 0.15s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 6px rgba(128, 0, 128, 0.4);
            transform: scale(1.02);
        }
        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding-left: 0.75rem;
            display: flex;
            align-items: center;
            pointer-events: none;
            color: #9CA3AF;
        }
        .toggle-password {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            padding-right: 0.75rem;
            cursor: pointer;
            color: #9CA3AF;
            transition: color 0.15s ease;
        }
        .toggle-password:hover {
            color: #800080;
        }
        input:focus, textarea:focus {
            box-shadow: 0 0 8px rgba(128, 0, 128, 0.5) !important;
            border-color: #800080 !important;
        }
        .modal {
            transition: opacity 0.3s ease;
        }
        .modal.hidden {
            opacity: 0;
            pointer-events: none;
        }
        /* Dynamic background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #800080, #660066, #800080);
            background-size: 200% 200%;
            animation: gradientShift 25s ease infinite;
            opacity: 0.03;
            z-index: -1;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Responsive adjustments */
        @media (max-width: 640px) {
            .login-card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            input, button {
                font-size: 0.875rem;
                padding: 0.5rem;
            }
            .pl-10 {
                padding-left: 2rem;
            }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-sans min-h-screen flex flex-col transition-colors duration-300">
    <!-- Particle background container -->
    <div id="particles-js" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;"></div>

    <!-- Admin Header -->
    <header class="header-glass fixed top-0 left-0 w-full z-50 animate-fade-in">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between py-3 sm:py-4">
            <!-- Admin Logo -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <i class="fas fa-shield-alt text-brand-purple text-lg sm:text-2xl animate-pulse"></i>
                <h1 class="text-lg sm:text-xl font-bold text-text-light dark:text-text-dark" style="font-family: 'Space Mono', monospace;">TraitKeeper Admin</h1>
            </div>

            <!-- Navigation -->
            <nav class="flex items-center space-x-3 sm:space-x-4">
                <button id="theme-toggle" aria-label="Toggle dark mode" class="nav-link text-text-secondary-light dark:text-text-secondary-dark hover:text-brand-purple text-sm sm:text-base">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 pt-16 sm:pt-20 pb-12 sm:pb-16 px-4 sm:px-6 lg:px-8 bg-background-light dark:bg-background-dark flex items-center justify-center">
        <div class="login-card shadow-xl rounded-xl p-6 sm:p-8 w-full max-w-md animate-fade-in">
            <h1 class="text-xl sm:text-3xl font-bold mb-4 sm:mb-6 text-center" style="font-family: 'Space Mono', monospace;">Login</h1>
            
            <!-- Error Messages -->
            {% if messages %}
            <div class="mb-4 p-3 sm:p-4 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-100 rounded-lg animate-slide-up">
                <i class="fas fa-exclamation-circle mr-2"></i>
                {% for message in messages %}
                    <span class="font-roboto text-xs sm:text-sm">{{ message }}</span>
                {% endfor %}
            </div>
            {% endif %}
            
            <!-- Error Message Area -->
            <div id="error-message" class="hidden mb-4 p-3 sm:p-4 bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-100 rounded-lg">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span id="error-text" class="font-roboto text-xs sm:text-sm"></span>
            </div>
            
            <!-- Credentials Login Form -->
            <form id="credentials-form" class="animate-slide-up" method="post" action="{% url 'admin_panel:login' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="username" class="block text-xs sm:text-sm font-medium mb-2 font-roboto">Username or Email</label>
                    <div class="relative">
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="username" name="username" class="pl-10 py-2 sm:py-3 px-4 w-full border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white dark:bg-gray-800 text-text-light dark:text-text-dark font-roboto text-sm" placeholder="Enter your username or email" required>
                    </div>
                </div>
                <div class="mb-4 sm:mb-6">
                    <label for="password" class="block text-xs sm:text-sm font-medium mb-2 font-roboto">Password</label>
                    <div class="relative">
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" class="pl-10 pr-10 py-2 sm:py-3 px-4 w-full border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white dark:bg-gray-800 text-text-light dark:text-text-dark font-roboto text-sm" placeholder="Enter your password" required>
                        <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row items-center justify-between mb-4 space-y-3 sm:space-y-0">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                        <label for="remember" class="ml-2 text-xs sm:text-sm font-roboto">Remember me</label>
                    </div>
                    <button type="button" id="forgot-password" class="text-xs sm:text-sm text-primary hover:text-primary-dark font-roboto">Forgot password?</button>
                </div>
                <button type="submit" class="w-full glow-button text-white py-2 sm:py-3 px-4 rounded-lg font-medium flex items-center justify-center text-sm sm:text-base">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login
                </button>
            </form>

            <!-- Forgot Password Modal -->
            <div id="forgot-password-modal" class="modal fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50" role="dialog" aria-modal="true">
                <div class="bg-white dark:bg-gray-800 p-4 sm:p-6 rounded-lg shadow-lg max-w-md w-full">
                    <h3 class="text-lg font-semibold mb-4 font-roboto text-text-light dark:text-text-dark">Reset Password</h3>
                    <p class="text-sm font-roboto text-text-light dark:text-text-dark mb-4">Enter your email address to receive a password reset link.</p>
                    <form id="forgot-password-form" method="post" action="{% url 'admin_panel:password_reset' %}">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="email" class="block text-xs sm:text-sm font-medium mb-2 font-roboto">Email Address</label>
                            <div class="relative">
                                <div class="input-icon">
                                    <i class="fas fa-envelope"></i>
                                </div>
                                <input type="email" id="email" name="email" class="pl-10 py-2 sm:py-3 px-4 w-full border border-gray-200 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white dark:bg-gray-800 text-text-light dark:text-text-dark font-roboto text-sm" placeholder="Enter your email" required>
                            </div>
                            <p id="email-error" class="text-red-500 dark:text-red-400 text-xs sm:text-sm mt-1 font-roboto hidden"></p>
                        </div>
                        <div class="flex justify-end space-x-3">
                            <button type="button" id="cancel-forgot-password" class="px-4 py-2 rounded-lg bg-gray-300 dark:bg-gray-600 text-text-light dark:text-text-dark font-roboto text-sm" aria-label="Cancel password reset">Cancel</button>
                            <button type="submit" id="submit-forgot-password" class="glow-button text-white px-4 py-2 rounded-lg font-roboto text-sm" aria-label="Submit password reset request">
                                <span id="forgot-password-text">Send Reset Link</span>
                                <svg id="forgot-password-spinner" class="hidden animate-spin h-5 w-5 ml-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Admin Footer -->
    <footer class="bg-accent-light dark:bg-accent-dark border-t border-border-light dark:border-border-dark text-text-secondary-light dark:text-text-secondary-dark py-3 sm:py-4 px-4 flex flex-col sm:flex-row justify-between items-center text-xs sm:text-sm shadow-inner">
        <div class="flex items-center space-x-2 mb-2 sm:mb-0">
            <i class="fas fa-copyright"></i>
            <span>2025 TraitKeeper Admin. All rights reserved.</span>
        </div>
        <div class="flex items-center space-x-3 sm:space-x-4">
            <a href="#" class="hover:text-brand-purple transition-colors duration-300">Help</a>
            <a href="#" class="hover:text-brand-purple transition-colors duration-300">Support</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize particles.js with subtle settings
            particlesJS('particles-js', {
                particles: {
                    number: { value: 20, density: { enable: true, value_area: 1000 } },
                    color: { value: '#800080' },
                    shape: { type: 'circle' },
                    opacity: { value: 0.2, random: true },
                    size: { value: 2, random: true },
                    move: { enable: true, speed: 0.3, direction: 'none', random: true }
                },
                interactivity: {
                    events: { onhover: { enable: false }, onclick: { enable: false } }
                }
            });

            // Theme Toggle
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;

            function updateThemeIcon() {
                if (themeToggle) {
                    themeToggle.innerHTML = html.classList.contains('dark') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                }
            }

            function setTheme(theme) {
                localStorage.setItem('theme', theme);
                if (theme === 'dark') {
                    html.classList.add('dark');
                    html.classList.remove('light');
                } else {
                    html.classList.add('light');
                    html.classList.remove('dark');
                }
                updateThemeIcon();
            }

            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let initialTheme = 'light';
            if (savedTheme) {
                initialTheme = savedTheme;
            } else if (prefersDark) {
                initialTheme = 'dark';
            }
            setTheme(initialTheme);

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
                    setTheme(newTheme);
                });
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!localStorage.getItem('theme')) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });

            // Password Preview Toggle
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', () => {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    togglePassword.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                });
            }

            // Forgot Password Modal
            const forgotPasswordButton = document.getElementById('forgot-password');
            const forgotPasswordModal = document.getElementById('forgot-password-modal');
            const cancelForgotPassword = document.getElementById('cancel-forgot-password');
            const forgotPasswordForm = document.getElementById('forgot-password-form');
            const submitForgotPassword = document.getElementById('submit-forgot-password');

            if (forgotPasswordButton && forgotPasswordModal) {
                forgotPasswordButton.addEventListener('click', () => {
                    forgotPasswordModal.classList.remove('hidden');
                });
            }

            if (cancelForgotPassword) {
                cancelForgotPassword.addEventListener('click', () => {
                    forgotPasswordModal.classList.add('hidden');
                    forgotPasswordForm.reset();
                    document.getElementById('email-error').classList.add('hidden');
                });
            }

            if (forgotPasswordForm) {
                forgotPasswordForm.addEventListener('submit', function(e) {
                    const email = document.getElementById('email').value;
                    const emailError = document.getElementById('email-error');
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (!emailRegex.test(email)) {
                        e.preventDefault();
                        emailError.textContent = 'Please enter a valid email address.';
                        emailError.classList.remove('hidden');
                    } else {
                        emailError.classList.add('hidden');
                        document.getElementById('forgot-password-text').textContent = 'Sending...';
                        document.getElementById('forgot-password-spinner').classList.remove('hidden');
                        submitForgotPassword.disabled = true;
                    }
                });
            }
        });
    </script>
</body>
</html>
