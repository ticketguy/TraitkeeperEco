<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | TraitKeeper Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold mb-4 text-center">Reset Your Password</h1>
        {% if error %}
            <p class="text-red-500 text-center mb-4">{{ error }}</p>
            <a href="{% url 'admin_panel:login' %}" class="block text-center text-blue-500 hover:underline">Back to Login</a>
        {% else %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_new_password1" class="block text-sm font-medium mb-2">New Password</label>
                    <input type="password" id="id_new_password1" name="new_password1" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-4">
                    <label for="id_new_password2" class="block text-sm font-medium mb-2">Confirm New Password</label>
                    <input type="password" id="id_new_password2" name="new_password2" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                {% if form.errors %}
                    <p class="text-red-500 text-sm mb-4">{{ form.errors.as_text }}</p>
                {% endif %}
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Reset Password</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
