{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error Logs - TraitKeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#800080',
                        'primary-dark': '#660066',
                        'primary-light': '#9933cc',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .gradient-animate {
            background-size: 200% 200%;
            animation: gradient-shift 8s ease infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-[#800080]/20 to-gray-900 text-gray-100 min-h-screen">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-[#800080]/30 via-[#660066]/20 to-[#800080]/30 border-b border-[#800080]/30 backdrop-blur-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <a href="{% url 'system_health:dashboard' %}" class="text-[#9933cc] hover:text-[#800080] transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                            </svg>
                        </a>
                        <h1 class="text-2xl font-bold bg-gradient-to-r from-[#800080] to-[#660066] bg-clip-text text-transparent">📋 System Error Logs</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="last-updated" class="text-sm text-[#9933cc]">Loading...</span>
                        <button onclick="refreshLogs()" class="px-4 py-2 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-[#660066] rounded-lg text-sm font-medium transition-all duration-300 shadow-lg shadow-primary/30">
                            🔄 Refresh
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Filters -->
            <div class="bg-gray-800/90 rounded-lg p-6 border border-[#800080]/30 shadow-lg shadow-primary/10 mb-8">
                <h2 class="text-lg font-semibold text-[#9933cc] mb-4">Filters</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Time Range</label>
                        <select id="time-range" class="w-full bg-gray-900 text-gray-100 rounded px-3 py-2 border border-[#800080]/30 focus:border-[#800080] focus:outline-none">
                            <option value="1">Last Hour</option>
                            <option value="6">Last 6 Hours</option>
                            <option value="24" selected>Last 24 Hours</option>
                            <option value="72">Last 3 Days</option>
                            <option value="168">Last 7 Days</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Log Level</label>
                        <select id="log-level" class="w-full bg-gray-900 text-gray-100 rounded px-3 py-2 border border-[#800080]/30 focus:border-[#800080] focus:outline-none">
                            <option value="all">All Levels</option>
                            <option value="CRITICAL">Critical Only</option>
                            <option value="ERROR">Error & Above</option>
                            <option value="WARNING">Warning & Above</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Status</label>
                        <select id="resolved-status" class="w-full bg-gray-900 text-gray-100 rounded px-3 py-2 border border-[#800080]/30 focus:border-[#800080] focus:outline-none">
                            <option value="all">All Status</option>
                            <option value="active">Active Only</option>
                            <option value="resolved">Resolved Only</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="applyFilters()" class="w-full px-4 py-2 bg-gradient-to-r from-primary to-primary-dark hover:from-primary-dark hover:to-[#660066] rounded-lg font-medium transition-all duration-300 shadow-lg shadow-primary/30">
                            Apply Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Summary -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-gray-800/90 rounded-lg p-4 border border-red-500/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-400">Critical Errors</span>
                        <span class="text-2xl">🚨</span>
                    </div>
                    <p id="critical-count" class="text-3xl font-bold text-red-400">--</p>
                </div>
                <div class="bg-gray-800/90 rounded-lg p-4 border border-orange-500/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-400">Errors</span>
                        <span class="text-2xl">❌</span>
                    </div>
                    <p id="error-count" class="text-3xl font-bold text-orange-400">--</p>
                </div>
                <div class="bg-gray-800/90 rounded-lg p-4 border border-yellow-500/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-400">Warnings</span>
                        <span class="text-2xl">⚠️</span>
                    </div>
                    <p id="warning-count" class="text-3xl font-bold text-yellow-400">--</p>
                </div>
                <div class="bg-gray-800/90 rounded-lg p-4 border border-[#800080]/30">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-400">Total Logs</span>
                        <span class="text-2xl">📊</span>
                    </div>
                    <p id="total-count" class="text-3xl font-bold text-[#9933cc]">--</p>
                </div>
            </div>

            <!-- Error Logs Container -->
            <div class="bg-gray-800/90 rounded-lg p-6 border border-[#800080]/30 shadow-lg shadow-primary/10">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-[#9933cc]">Error Log Entries</h2>
                    <span id="log-count-badge" class="px-3 py-1 bg-[#800080]/50 text-[#9933cc] rounded-full text-sm font-medium">
                        Loading...
                    </span>
                </div>
                <div id="error-logs-container" class="space-y-3 max-h-[800px] overflow-y-auto">
                    <div class="flex items-center justify-center p-12 text-[#9933cc]">
                        <div class="text-center">
                            <div class="animate-pulse text-4xl mb-4">⏳</div>
                            <p>Loading error logs...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // API base URL
        const API_BASE = '/system-health/api';
        let allLogs = [];

        // Fetch and display error logs
        async function fetchErrorLogs() {
            try {
                const hours = document.getElementById('time-range').value;
                const response = await fetch(`${API_BASE}/error-logs/?hours=${hours}`);
                const data = await response.json();

                allLogs = data.logs || [];

                // Update stats
                updateStats(allLogs);

                // Update timestamp
                const now = new Date();
                document.getElementById('last-updated').textContent = `Last updated: ${now.toLocaleTimeString()}`;

                // Apply current filters
                applyFilters();

            } catch (error) {
                console.error('Error fetching error logs:', error);
                document.getElementById('error-logs-container').innerHTML = `
                    <div class="text-center p-12">
                        <p class="text-red-400 text-lg">Failed to load error logs</p>
                        <p class="text-gray-400 text-sm mt-2">${error.message}</p>
                    </div>
                `;
            }
        }

        // Update statistics
        function updateStats(logs) {
            const criticalCount = logs.filter(l => l.level === 'CRITICAL').length;
            const errorCount = logs.filter(l => l.level === 'ERROR').length;
            const warningCount = logs.filter(l => l.level === 'WARNING').length;

            document.getElementById('critical-count').textContent = criticalCount;
            document.getElementById('error-count').textContent = errorCount;
            document.getElementById('warning-count').textContent = warningCount;
            document.getElementById('total-count').textContent = logs.length;
        }

        // Apply filters
        function applyFilters() {
            const logLevel = document.getElementById('log-level').value;
            const resolvedStatus = document.getElementById('resolved-status').value;

            let filteredLogs = [...allLogs];

            // Filter by log level
            if (logLevel !== 'all') {
                const levelPriority = { 'WARNING': 1, 'ERROR': 2, 'CRITICAL': 3 };
                const minPriority = levelPriority[logLevel] || 1;
                filteredLogs = filteredLogs.filter(log => {
                    const logPriority = levelPriority[log.level] || 0;
                    return logPriority >= minPriority;
                });
            }

            // Filter by resolved status
            if (resolvedStatus === 'active') {
                filteredLogs = filteredLogs.filter(log => !log.resolved);
            } else if (resolvedStatus === 'resolved') {
                filteredLogs = filteredLogs.filter(log => log.resolved);
            }

            // Display filtered logs
            displayLogs(filteredLogs);
        }

        // Display logs
        function displayLogs(logs) {
            const container = document.getElementById('error-logs-container');
            const badge = document.getElementById('log-count-badge');

            badge.textContent = `${logs.length} log${logs.length !== 1 ? 's' : ''}`;

            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-12 bg-green-900/20 rounded-lg border border-green-500/30">
                        <div class="text-4xl mb-4">✅</div>
                        <p class="text-green-400 text-lg font-medium">No error logs found</p>
                        <p class="text-green-300/70 text-sm mt-2">All systems operating normally for the selected period</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = logs.map(log => {
                const levelColors = {
                    'WARNING': 'bg-yellow-900/30 border-yellow-600 text-yellow-200',
                    'ERROR': 'bg-orange-900/30 border-orange-600 text-orange-200',
                    'CRITICAL': 'bg-red-900/30 border-red-600 text-red-200'
                };
                const colorClass = levelColors[log.level] || 'bg-gray-700 border-gray-500';

                const levelIcons = {
                    'WARNING': '⚠️',
                    'ERROR': '❌',
                    'CRITICAL': '🚨'
                };
                const icon = levelIcons[log.level] || '📢';

                const timestamp = new Date(log.timestamp);
                const timeStr = timestamp.toLocaleString();

                const resolvedBadge = log.resolved
                    ? '<span class="text-xs bg-green-900/50 text-green-300 px-2 py-0.5 rounded font-medium">✓ Resolved</span>'
                    : '<span class="text-xs bg-red-900/50 text-red-300 px-2 py-0.5 rounded font-medium">● Active</span>';

                return `
                    <div class="${colorClass} border-l-4 p-4 rounded-lg shadow-lg transition-all duration-300 hover:scale-[1.01]">
                        <div class="flex items-start justify-between mb-2">
                            <div class="flex items-center space-x-3">
                                <span class="text-2xl">${icon}</span>
                                <div>
                                    <div class="flex items-center space-x-2 mb-1">
                                        <span class="font-bold text-sm">${log.level}</span>
                                        <span class="text-xs opacity-75 bg-black/30 px-2 py-0.5 rounded">${log.category}</span>
                                        ${resolvedBadge}
                                    </div>
                                    <p class="font-semibold text-base">${log.title}</p>
                                </div>
                            </div>
                            <span class="text-xs opacity-75">${timeStr}</span>
                        </div>
                        <p class="text-sm opacity-90 mb-3 ml-11">${log.message}</p>
                        <div class="flex items-center justify-between text-xs opacity-75 ml-11 pt-2 border-t border-white/10">
                            <span>Source: <span class="font-medium">${log.source}</span></span>
                            ${log.duration ? `<span>Duration: <span class="font-medium">${formatDuration(log.duration)}</span></span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Format duration
        function formatDuration(seconds) {
            if (seconds < 60) return `${Math.floor(seconds)}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            return `${Math.floor(seconds / 3600)}h`;
        }

        // Refresh logs
        async function refreshLogs() {
            await fetchErrorLogs();
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Initial load
            fetchErrorLogs();

            // Auto-refresh every 30 seconds
            setInterval(fetchErrorLogs, 30000);

            // Add change listeners to filters
            document.getElementById('time-range').addEventListener('change', fetchErrorLogs);
        });
    </script>
</body>
</html>
