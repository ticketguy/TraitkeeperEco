# ==================================================
# TraitKeeper Production Deployment Pipeline
# ==================================================
# This GitHub Actions workflow handles:
# - Code quality checks
# - Security scanning
# - Automated testing
# - Docker image building
# - Production deployment
# ==================================================

name: Production Deployment

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production
  workflow_dispatch:  # Allow manual triggers

# Environment variables
env:
  PYTHON_VERSION: '3.12'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/traitkeeper

jobs:
  # ==================================================
  # Job 1: Code Quality & Security
  # ==================================================
  code-quality:
    name: Code Quality & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run security check (Bandit)
        run: |
          poetry add --group dev bandit
          poetry run bandit -r . -x ./tests,./venv,./.venv -ll
        continue-on-error: true

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log statements..."
          CONSOLE_COUNT=$(grep -r "console\.log" templates/ static/js/ 2>/dev/null | wc -l || echo "0")
          echo "Found $CONSOLE_COUNT console.log statements"
          if [ $CONSOLE_COUNT -gt 50 ]; then
            echo "::warning::Found $CONSOLE_COUNT console.log statements. Consider cleaning up before production."
          fi

      - name: Check for exposed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true  # Don't fail the workflow if TruffleHog errors

  # ==================================================
  # Job 2: Run Tests
  # ==================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Django system check
        env:
          SECRET_KEY: test-secret-key-for-ci-that-is-long-enough-to-pass-security-checks-in-github-actions
          DEBUG: 'False'
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
          SECURE_SSL_REDIRECT: 'False'  # Not needed in test environment
          SESSION_COOKIE_SECURE: 'False'  # Not needed in test environment
          CSRF_COOKIE_SECURE: 'False'  # Not needed in test environment
        run: |
          poetry run python manage.py check --deploy --fail-level ERROR

      - name: Run migrations
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          poetry run python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: 'True'
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          poetry run pytest --maxfail=5 --disable-warnings -v
        continue-on-error: true

  # ==================================================
  # Job 3: Build Docker Image
  # ==================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================================================
  # Job 4: Deploy to Production
  # ==================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://traitkeeper.xyz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd /home/user/TraitkeeperEco || exit 1

            # Pull latest changes
            git pull origin main

            # Pull latest Docker images
            docker compose pull

            # Rebuild and restart services
            docker compose up -d --build --force-recreate

            # Run migrations
            docker compose exec -T main python manage.py migrate --noinput

            # Collect static files
            docker compose exec -T main python manage.py collectstatic --noinput

            # Health check
            sleep 10
            docker compose ps

            echo "✅ Deployment complete!"

      - name: Run post-deployment health checks
        run: |
          # Wait for application to be ready
          sleep 30

          # Health check (adjust URL as needed)
          response=$(curl -s -o /dev/null -w "%{http_code}" https://traitkeeper.xyz/health/ || echo "000")

          if [ "$response" = "200" ] || [ "$response" = "301" ] || [ "$response" = "302" ]; then
            echo "✅ Health check passed (HTTP $response)"
          else
            echo "❌ Health check failed (HTTP $response)"
            exit 1
          fi

  # ==================================================
  # Job 5: Rollback (Manual)
  # ==================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production

    steps:
      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            cd /home/user/TraitkeeperEco

            # Rollback git
            git reset --hard HEAD~1

            # Rebuild with previous version
            docker compose up -d --build --force-recreate

            echo "✅ Rollback complete!"
